; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino
build_flags =
    -DHAL_FDCAN_MODULE_ENABLED
    -Wl,-u,_printf_float
lib_deps =
    sparkfun/SparkFun 6DoF LSM6DSV16X

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<control/BalanceController.cpp>
    +<safety/SafetyManager.cpp>
    +<control/RobotController.cpp>
    +<motor/OdescMotorController.cpp>
    +<control/ControlWatchdog.cpp>
    +<control/CommandWatchdog.cpp>
    +<control/AttitudeEstimator.cpp>
    +<control/MotionCommandProtocol.cpp>
    +<control/CommandSequenceTracker.cpp>
    +<control/MotionCommandValidator.cpp>
    +<control/MotionCommandStreamParser.cpp>
    +<control/MotionCommandReceiver.cpp>
    +<safety/TiltMonitor.cpp>
    +<safety/SafetyInputs.cpp>
    +<control/ControlParamsValidator.cpp>
    +<motor/TorqueLimiter.cpp>
    +<control/ControlParamsSerializer.cpp>
